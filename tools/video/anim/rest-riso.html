<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
 * A/B テスト 1本目: 手描き・印刷風の「1日サボった」(12秒)。?t=秒 の1コマを描く。絵の部品は style3.html と同じ
 * 話と文字は5つの絵柄で同じにする(rest-*.html)
 * - 墨の線で輪郭。線を少し揺らして手描きのムラ(b を変えると揺れが変わる → 動画では線が震える)
 * - 色は2色(オレンジ・青)。塗りを輪郭からずらして刷りのズレを出す。重なりは乗算
 * - 影はグラデーションをやめて網点
 * - 文字は明朝系(Georgia)。大事な語は帯のかわりに手描きの下線
 * TikTok で隠れる範囲: 上200 / 下450(y>1470)/ 右150(x>930, y 700〜1600)
 */
const W = 1080, H = 1920;
const Q = new URLSearchParams(location.search);
const T = +(Q.get('t') || 0);
const F = T < 1.5 ? 1 : T < 6.2 ? 2 : 3;      // 1 びっくり / 2 泣く〜通知 / 3 喜ぶ〜締め
const BOIL = Math.floor(T * 8) % 4;          // 線を1秒に8回描き直す(手描きアニメの震え)
const ctx = document.getElementById('c').getContext('2d');
const icon = new Image(); icon.src = 'icon.png';
const INK = '#2B2A28', PAPER = '#F3EDE1', ORANGE = '#E8794C', BLUE = '#5677A8', SKIN = '#F1CDAE', TAN = '#D6A06A';
const SERIF = 'Georgia, "Times New Roman", serif';
const MIS = [7, 5];   // 刷りのズレ
let MULT = true;      // 塗りを乗算で重ねるか(濃い地の上では切る)

function rand(seed) { let s = seed % 2147483646 + 1; return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
let seedN = 1; const nextSeed = () => (seedN++) * 7919 + BOIL * 104729;
function jitter(pts, amp) { const r = rand(nextSeed()); return pts.map(([x, y]) => [x + (r() - .5) * 2 * amp, y + (r() - .5) * 2 * amp]); }
function smooth(pts, closed) { ctx.beginPath(); const n = pts.length; if (n < 2) return;
  if (!closed) { ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); } ctx.lineTo(pts[n - 1][0], pts[n - 1][1]); return; }
  const m = (i) => [(pts[i % n][0] + pts[(i + 1) % n][0]) / 2, (pts[i % n][1] + pts[(i + 1) % n][1]) / 2];
  const s = m(0); ctx.moveTo(s[0], s[1]); for (let i = 1; i <= n; i++) { const p = pts[i % n], q = m(i); ctx.quadraticCurveTo(p[0], p[1], q[0], q[1]); } ctx.closePath(); }
function ell(cx, cy, rx, ry, n = 26) { return Array.from({ length: n }, (_, i) => { const a = i / n * Math.PI * 2; return [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]; }); }
function limbPts(a, b, wa, wb) { const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), nx = -Math.sin(ang), ny = Math.cos(ang), pts = [];
  for (let i = 0; i <= 6; i++) { const t = i / 6; pts.push([a[0] + (b[0] - a[0]) * t + nx * (wa + (wb - wa) * t) / 2, a[1] + (b[1] - a[1]) * t + ny * (wa + (wb - wa) * t) / 2]); }
  for (let i = 0; i <= 6; i++) { const aa = ang + Math.PI / 2 - i / 6 * Math.PI; pts.push([b[0] + Math.cos(aa) * wb / 2, b[1] + Math.sin(aa) * wb / 2]); }
  for (let i = 6; i >= 0; i--) { const t = i / 6; pts.push([a[0] + (b[0] - a[0]) * t - nx * (wa + (wb - wa) * t) / 2, a[1] + (b[1] - a[1]) * t - ny * (wa + (wb - wa) * t) / 2]); }
  for (let i = 0; i <= 6; i++) { const aa = ang - Math.PI / 2 - i / 6 * Math.PI; pts.push([a[0] + Math.cos(aa) * wa / 2, a[1] + Math.sin(aa) * wa / 2]); }
  return pts; }
/* 塗り(ずらして乗算)と墨の線 */
function fill(pts, col, mis = true) { ctx.save(); if (MULT) ctx.globalCompositeOperation = 'multiply'; if (mis) ctx.translate(MIS[0], MIS[1]); ctx.fillStyle = col; smooth(jitter(pts, 1.5), true); ctx.fill(); ctx.restore(); }
function ink(pts, closed = true, w = 6, amp = 2.2) { ctx.strokeStyle = INK; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; smooth(jitter(pts, amp), closed); ctx.stroke(); }
function inkFill(pts, col = INK) { ctx.fillStyle = col; smooth(jitter(pts, 2), true); ctx.fill(); }
/* 網点(pts の内側に、dir 方向へ濃くなる点) */
function halftone(pts, col, from, to, maxR = 6, step = 15) { ctx.save(); smooth(pts, true); ctx.clip(); ctx.fillStyle = col; ctx.globalCompositeOperation = 'multiply';
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  for (let y = Math.min(...ys); y < Math.max(...ys); y += step) for (let x = Math.min(...xs) + ((y / step) % 2 ? step / 2 : 0); x < Math.max(...xs); x += step) {
    const t = Math.max(0, Math.min(1, ((x - from[0]) * (to[0] - from[0]) + (y - from[1]) * (to[1] - from[1])) / ((to[0] - from[0]) ** 2 + (to[1] - from[1]) ** 2)));
    const r = maxR * t; if (r > .6) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); } }
  ctx.restore(); }

function person(x, y, s, P, face, shirt = ORANGE) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // 影(網点)
  halftone(ell(0, P.ground, 170, 26), INK, [0, P.ground - 40], [0, P.ground + 60], 4.5, 12);
  const legs = () => { [[[-28, 0], P.kneeL, P.footL, -1], [[28, 0], P.kneeR, P.footR, 1]].forEach(([h, k, f, d]) => {
    const pts = [...limbPts(h, k, 58, 46)]; inkFill(pts, '#3A3936'); inkFill(limbPts(k, f, 46, 38), '#3A3936');
    const sh = ell(f[0] + 14 * d, f[1] + 10, 42, 20); fill(sh, PAPER, false); ink(sh, true, 5); }); };
  if (!P.legsFront) legs();
  // パーカー
  const hood = [[-72, -224], [-36, -240], [0, -236], [36, -240], [72, -224], [90, -150], [84, -60], [74, 8], [0, 18], [-74, 8], [-84, -60], [-90, -150]];
  fill(hood, shirt); halftone(hood, INK, [10, -100], [100, -100], 4, 14); ink(hood, true, 6);
  ink([[-40, -60], [0, -52], [42, -62]], false, 4); ink([[-14, -226], [-16, -176]], false, 3.5); ink([[14, -226], [16, -176]], false, 3.5);
  if (P.legsFront) legs();
  // 腕
  [[[-62, -200], P.elbowL, P.handL], [[62, -200], P.elbowR, P.handR]].forEach(([sh, el, hd]) => {
    const up = limbPts(sh, el, 44, 36), lo = limbPts(el, hd, 36, 28); fill(up, shirt); fill(lo, shirt); ink(up, true, 5); ink(lo, true, 5);
    const h = ell(hd[0], hd[1], 21, 23, 16); fill(h, SKIN, false); ink(h, true, 4.5); });
  // 頭
  ctx.save(); ctx.translate(0, -330); ctx.rotate(P.tilt || 0);
  const head = ell(0, 0, 76, 82); fill(head, SKIN); ink(head, true, 6);
  inkFill([[-82, -4], [-80, -56], [-46, -92], [6, -98], [56, -88], [84, -40], [82, -8], [56, -46], [22, -50], [-4, -30], [-30, -48], [-60, -38]]);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = 'rgba(232,121,76,.5)'; [[-46, 30], [46, 30]].forEach(([cx, cy]) => { smooth(jitter(ell(cx, cy, 15, 10, 12), 1), true); ctx.fill(); }); ctx.restore();
  if (face === 'shock') { [[-27, 2], [27, 2]].forEach(([ex, ey]) => { const e = ell(ex, ey, 15, 19, 14); fill(e, '#fff', false); ink(e, true, 4); inkFill(ell(ex, ey + 4, 7, 8, 10)); });
    inkFill(ell(0, 48, 13, 17, 14)); ink([[-44, -26], [-18, -32]], false, 5); ink([[44, -26], [18, -32]], false, 5); }
  else if (face === 'sad') { ink([[-40, 8], [-27, 17], [-14, 8]], false, 5.5); ink([[14, 8], [27, 17], [40, 8]], false, 5.5); ink([[-13, 52], [0, 44], [13, 52]], false, 5);
    ink([[-42, -18], [-18, -24]], false, 4.5); ink([[42, -18], [18, -24]], false, 4.5); fill(ell(-30, 34, 6, 10, 10), BLUE, false); }
  else { ink([[-40, 6], [-27, -8], [-14, 6]], false, 5.5); ink([[14, 6], [27, -8], [40, 6]], false, 5.5); inkFill([[-26, 34], [0, 40], [26, 34], [14, 62], [0, 68], [-14, 62]]); }
  ctx.restore(); ctx.restore();
}
const POSES = {
  shock: { ground: 312, kneeL: [-34, 150], footL: [-38, 296], kneeR: [34, 150], footR: [38, 296], elbowL: [-112, -150], handL: [-68, -300], elbowR: [112, -150], handR: [68, -300] },
  sit: { ground: 60, tilt: .12, legsFront: true, kneeL: [-46, -150], footL: [-56, 40], kneeR: [46, -150], footR: [56, 40], elbowL: [-104, -120], handL: [-30, -150], elbowR: [104, -120], handR: [30, -150] },
  joy: { ground: 430, kneeL: [-74, 120], footL: [-40, 250], kneeR: [64, 96], footR: [140, 190], elbowL: [-130, -300], handL: [-150, -420], elbowR: [130, -300], handR: [150, -420] },
};
function dog(x, y, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  halftone(ell(0, 120, 140, 20), INK, [0, 90], [0, 150], 4, 12);
  [[-60, -14], [-30, 14], [40, -14], [68, 14]].forEach(([lx, dx]) => { const l = limbPts([lx, 10], [lx + dx, 100], 26, 22); fill(l, TAN); ink(l, true, 4.5); });
  const body = ell(0, 0, 100, 56); fill(body, TAN); halftone(body, INK, [0, -20], [0, 60], 4, 13); ink(body, true, 5.5);
  const tail = limbPts([-90, -10], [-140, -80], 22, 12); fill(tail, TAN); ink(tail, true, 4.5);
  const head = ell(96, -50, 52, 48); fill(head, TAN); ink(head, true, 5.5);
  const ear = ell(70, -72, 18, 36, 14); inkFill(ear, '#8E6136'); ink(ear, true, 4);
  const snout = ell(134, -34, 26, 20, 14); fill(snout, PAPER, false); ink(snout, true, 4);
  inkFill(ell(108, -62, 7, 7, 10)); inkFill(ell(152, -40, 9, 8, 10)); fill(ell(140, -12, 10, 15, 12), ORANGE, false); ctx.restore(); }

function text(str, x, y, size, col, style = 'bold') { ctx.font = `${style} ${size}px ${SERIF}`; ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillText(str, x, y); return ctx.measureText(str).width; }
function underline(x, y, w, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'round'; const r = rand(nextSeed());
  ctx.beginPath(); ctx.moveTo(x - 6, y + 4); for (let i = 1; i <= 8; i++) ctx.lineTo(x + w * i / 8, y + (r() - .5) * 8 + (i === 8 ? -6 : 0)); ctx.stroke();
  ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x + 10, y + 18); for (let i = 1; i <= 6; i++) ctx.lineTo(x + w * .85 * i / 6, y + 16 + (r() - .5) * 6); ctx.stroke(); ctx.restore(); }
function counter(n, y, col, sub) { const w = text(`${n}`, 140, y, 120, col); text(' of 66 days', 140 + w, y, 44, sub, 'italic');
  ink([[140, y + 40], [850, y + 40]], false, 3, 1.2); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(140, y + 40); ctx.lineTo(140 + 710 * n / 66, y + 40); ctx.stroke(); ctx.restore(); }
function notif(y) { const box = []; const x0 = 96, x1 = 884, y0 = y, y1 = y + 192, r = 40;
  for (let i = 0; i <= 8; i++) box.push([x0 + r + (x1 - x0 - 2 * r) * i / 8, y0]); for (let i = 0; i <= 3; i++) box.push([x1, y0 + r + (y1 - y0 - 2 * r) * i / 3]);
  for (let i = 0; i <= 8; i++) box.push([x1 - r - (x1 - x0 - 2 * r) * i / 8, y1]); for (let i = 0; i <= 3; i++) box.push([x0, y1 - r - (y1 - y0 - 2 * r) * i / 3]);
  fill(box, '#FFFFFF', false); fill(box.map(([px, py]) => [px + 8, py + 8]), 'rgba(43,42,40,.12)', false); fill(box, '#FFFFFF', false); ink(box, true, 5, 1.6);
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(126, y + 44, 104, 104, 24); ctx.fill(); if (icon.complete && icon.naturalWidth) ctx.drawImage(icon, 134, y + 52, 88, 88);
  ctx.font = `700 34px -apple-system, sans-serif`; ctx.fillStyle = INK; ctx.fillText('KATSU', 256, y + 78); ctx.font = `500 32px -apple-system, sans-serif`;
  ctx.fillText('Yesterday was a rest day. You have', 256, y + 124); ctx.fillText('1 left in the last 7 days.', 256, y + 164); }

function paper(col) { ctx.fillStyle = col; ctx.fillRect(0, 0, W, H); }
function grain(alpha) { const img = ctx.getImageData(0, 0, W, H), d = img.data, r = rand(31 + F + BOIL);
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 255 * alpha; d[i] += n; d[i + 1] += n; d[i + 2] += n; } ctx.putImageData(img, 0, 0);
  const rr = rand(77); ctx.strokeStyle = 'rgba(43,42,40,.05)'; ctx.lineWidth = 1; for (let i = 0; i < 120; i++) { const x = rr() * W, y = rr() * H, l = 10 + rr() * 30, a = rr() * 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke(); } }


const seg = (a, b) => Math.max(0, Math.min(1, (T - a) / (b - a)));
function popAt(t0) { const k = seg(t0, t0 + .3), c1 = 1.70158, c3 = c1 + 1; return { a: Math.min(1, k * 2), sc: .7 + .3 * (1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2)) }; }
function withPop(t0, x, y, fn) { if (T < t0) return; const p = popAt(t0); ctx.save(); ctx.globalAlpha = p.a; ctx.translate(x, y); ctx.scale(p.sc, p.sc); ctx.translate(-x, -y); fn(); ctx.restore(); }
function rect(x0, y0, x1, y1) { const p = []; for (let i = 0; i <= 6; i++) p.push([x0 + (x1 - x0) * i / 6, y0]); for (let i = 1; i <= 2; i++) p.push([x1, y0 + (y1 - y0) * i / 3]);
  for (let i = 0; i <= 6; i++) p.push([x1 - (x1 - x0) * i / 6, y1]); for (let i = 1; i <= 2; i++) p.push([x0, y1 - (y1 - y0) * i / 3]); return p; }
function phone(x, y, buzz) { const sh = buzz ? Math.sin(T * 90) * 5 : 0; ctx.save(); ctx.translate(x + sh, y);
  const body = rect(-34, -60, 34, 60); fill(body, INK, false); ink(body, true, 5, 1);
  if (buzz) { fill(rect(-24, -48, 24, 44), ORANGE, false); for (let i = 0; i < 2; i++) { ink([[50 + i * 16, -28], [58 + i * 16, 0], [50 + i * 16, 28]], false, 4, 1); ink([[-50 - i * 16, -28], [-58 - i * 16, 0], [-50 - i * 16, 28]], false, 4, 1); } }
  ctx.restore(); }
function pill(str, y) { ctx.font = `bold 54px ${SERIF}`; const w = ctx.measureText(str).width + 90, x0 = 495 - w / 2; const b = rect(x0, y - 62, x0 + w, y + 50);
  fill(b, INK, false); ink(b, true, 5, 1.5); text(str, x0 + 45, y + 8, 54, PAPER); }

function draw() {
  seedN = 1; paper(PAPER);
  if (F === 1) {
    ink([[40, 1300], [300, 1296], [620, 1302], [1040, 1297]], false, 4, 2);
    const sh = T < .6 ? Math.sin(T * 70) * 8 * (1 - T / .6) : 0;
    person(540 + sh, 1000, .9, POSES.shock, 'shock');
    counter(23, 1400, INK, '#6E6960');
    text('POV:', 140, 300, 44, INK, 'italic'); text('you skipped', 140, 410, 104, INK); const w = text('one day.', 140, 520, 104, INK); underline(140, 548, w, ORANGE);
    text('(23 days in)', 140, 640, 44, '#6E6960', 'italic');
  }
  if (F === 2) {
    ctx.fillStyle = BLUE; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); const rb = rand(3); for (let i = 20; i >= 0; i--) ctx.lineTo(W * i / 20, 1262 + (rb() - .5) * 6); ctx.closePath(); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.rect(0, 760, W, 500); ctx.clip(); ctx.fillStyle = 'rgba(43,42,40,.35)'; for (let y = 770; y < 1260; y += 15) for (let x = (y / 15) % 2 ? 7 : 0; x < W; x += 15) { ctx.beginPath(); ctx.arc(x, y, 4.2 * (y - 760) / 500, 0, 7); ctx.fill(); } ctx.restore();
    const r = rand(5); for (let i = 0; i < 60; i++) { const x = r() * W, y = (r() * 1180 + T * 700) % 1180, l = 30 + r() * 40; ink([[x, y], [x - 8, y + l]], false, 3.5, .8); }
    MULT = false; const clouds = [[430, 780, 86, 66], [650, 780, 86, 66], [540, 730, 112, 92], [540, 800, 150, 60]];
    clouds.forEach(([cx, cy, rx, ry]) => ink(ell(cx, cy, rx, ry, 22), true, 10)); clouds.forEach(([cx, cy, rx, ry]) => { ctx.fillStyle = '#D9D6CE'; smooth(ell(cx, cy, rx - 3, ry - 3, 22), true); ctx.fill(); });
    ink([[40, 1262], [400, 1258], [700, 1264], [1040, 1259]], false, 4, 2);
    person(540, 1180, 1.0, POSES.sit, T < 4.2 ? 'sad' : 'shock', '#E8794C');
    phone(790, 1215, T >= 3.6 && T < 4.8); MULT = true;
    counter(23, 1400, INK, '#6E6960');
    if (T < 3.6) { withPop(1.55, 140, 410, () => text('it’s over.', 140, 410, 120, PAPER)); withPop(2.4, 140, 490, () => text('back to day 1…', 140, 490, 48, 'rgba(243,237,225,.85)', 'italic')); }
    else if (T < 4.2) withPop(3.62, 140, 420, () => text('wait.', 140, 420, 160, PAPER));
    else { withPop(4.22, 140, 400, () => { const w = text('rest day.', 140, 400, 130, PAPER); underline(140, 430, w, ORANGE); }); withPop(4.5, 140, 520, () => text('1 left.', 140, 520, 104, PAPER));
      const k = seg(4.7, 5.0); if (k > 0) { ctx.save(); ctx.globalAlpha = k; ctx.translate(0, (1 - k) * -60); MULT = false; notif(580); MULT = true; ctx.restore(); } }
  }
  if (F === 3) {
    const sun = ell(830, 300, 120, 120, 28); fill(sun, ORANGE, false); halftone(sun, INK, [760, 230], [900, 370], 3.5, 13); ink(sun, true, 5);
    const r = rand(9); for (let i = 0; i < 26; i++) { const x = 100 + r() * 860 + Math.sin(T * 3 + i) * 20, y = 560 + ((r() * 700 + (T - 6.2) * 260) % 720), a = r() * 6 + T * 2, c = i % 3 === 0 ? BLUE : i % 3 === 1 ? ORANGE : PAPER;
      const pts = [[-14, -6], [14, -6], [14, 6], [-14, 6]].map(([px, py]) => [x + px * Math.cos(a) - py * Math.sin(a), y + px * Math.sin(a) + py * Math.cos(a)]); fill(pts, c, false); ink(pts, true, 3, .8); }
    ink([[40, 1300], [300, 1296], [620, 1302], [1040, 1297]], false, 4, 2);
    person(450, 1070 - Math.abs(Math.sin((T - 6.2) * 9)) * 36, .85, POSES.joy, 'joy');
    dog(790, 1180 - Math.abs(Math.sin((T - 6.2) * 9 + 1)) * 30, .75);
    if (T < 8.6) { withPop(6.25, 140, 400, () => { text('still', 140, 400, 72, '#6E6960', 'italic'); const w = text('23.', 300, 400, 150, INK); underline(300, 430, w, ORANGE); }); counter(23, 1420, INK, '#6E6960'); }
    else { withPop(8.65, 140, 380, () => text('rest days are', 140, 380, 84, INK)); withPop(8.8, 140, 490, () => { const w = text('built in.', 140, 490, 104, INK); underline(140, 518, w, ORANGE); });
      withPop(9.1, 140, 580, () => text('2 in any 7 days', 140, 580, 52, '#6E6960', 'italic')); withPop(9.6, 495, 1420, () => pill('search “KATSU habit”', 1420)); }
  }
  grain(.06);
}
const go = () => { draw(); document.title = 'done'; };
if (icon.complete) go(); else { icon.onload = go; icon.onerror = go; }
</script>
</body></html>
