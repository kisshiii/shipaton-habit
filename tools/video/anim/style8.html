<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* 絵柄の試し その7: ベクターのアーケード。?f=1 びっくり / 2 泣く / 3 喜ぶ
 * 黒い画面に光る細い線だけ。1UP と点数、ライフ(=休みの残り)。ブラウン管の走査線と端の丸み */
const W = 1080, H = 1920, F = +(new URLSearchParams(location.search).get('f') || 1);
const ctx = document.getElementById('c').getContext('2d');
const CY = '#7FF5E6', OR = '#FF9A4D', WH = '#F2F7FF', PK = '#FF6FA8', BL = '#7FA8FF', VEC = '"Menlo", "Courier New", monospace';
function limbPts(a, b, wa, wb) { const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), nx = -Math.sin(ang), ny = Math.cos(ang), p = [];
  for (let i = 0; i <= 4; i++) { const t = i / 4; p.push([a[0] + (b[0] - a[0]) * t + nx * (wa + (wb - wa) * t) / 2, a[1] + (b[1] - a[1]) * t + ny * (wa + (wb - wa) * t) / 2]); }
  for (let i = 0; i <= 4; i++) { const aa = ang + Math.PI / 2 - i / 4 * Math.PI; p.push([b[0] + Math.cos(aa) * wb / 2, b[1] + Math.sin(aa) * wb / 2]); }
  for (let i = 4; i >= 0; i--) { const t = i / 4; p.push([a[0] + (b[0] - a[0]) * t - nx * (wa + (wb - wa) * t) / 2, a[1] + (b[1] - a[1]) * t - ny * (wa + (wb - wa) * t) / 2]); }
  for (let i = 0; i <= 4; i++) { const aa = ang - Math.PI / 2 - i / 4 * Math.PI; p.push([a[0] + Math.cos(aa) * wa / 2, a[1] + Math.sin(aa) * wa / 2]); } return p; }
/* 光る線: 太いぼかし + 細い芯 */
function glow(drawPath, col, w = 4) { ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.shadowColor = col; ctx.shadowBlur = 26; ctx.strokeStyle = col; ctx.lineWidth = w * 1.6; ctx.globalAlpha = .55; drawPath(); ctx.stroke();
  ctx.shadowBlur = 8; ctx.globalAlpha = 1; ctx.lineWidth = w; drawPath(); ctx.stroke(); ctx.shadowBlur = 0; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = w * .35; ctx.globalAlpha = .7; drawPath(); ctx.stroke(); ctx.restore(); }
const P = (pts, closed = true) => () => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (closed) ctx.closePath(); };
const E = (cx, cy, rx, ry) => () => { ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); };
function vtext(str, x, y, size, col, align = 'left') { ctx.save(); ctx.font = `bold ${size}px ${VEC}`; ctx.textAlign = align; ctx.shadowColor = col; ctx.shadowBlur = 18; ctx.fillStyle = col; ctx.fillText(str, x, y); ctx.shadowBlur = 0; ctx.globalAlpha = .55; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); ctx.restore(); }

function person(x, y, s, Q, face) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  [[[-28, 0], Q.kneeL, Q.footL], [[28, 0], Q.kneeR, Q.footR]].forEach(([h, k, f]) => { glow(P(limbPts(h, k, 50, 40)), BL); glow(P(limbPts(k, f, 40, 32)), BL); glow(P([[f[0] - 30, f[1] + 18], [f[0] + 40, f[1] + 18]], false), BL); });
  glow(P([[-70, -224], [0, -238], [70, -224], [88, -140], [74, 8], [-74, 8], [-88, -140]]), OR);
  [[[-62, -200], Q.elbowL, Q.handL], [[62, -200], Q.elbowR, Q.handR]].forEach(([sh, el, hd]) => { glow(P(limbPts(sh, el, 40, 34)), OR); glow(P(limbPts(el, hd, 34, 28)), OR); glow(E(hd[0], hd[1], 18, 20), WH, 3); });
  ctx.save(); ctx.translate(0, -330); ctx.rotate(Q.tilt || 0); glow(E(0, 0, 76, 82), WH);
  glow(P([[-78, -10], [-60, -70], [0, -96], [60, -70], [78, -10], [40, -46], [0, -40], [-40, -46]]), CY, 3);
  if (face === 'shock') { glow(E(-27, 4, 13, 17), WH, 3); glow(E(27, 4, 13, 17), WH, 3); glow(E(0, 48, 11, 15), WH, 3); }
  else if (face === 'sad') { glow(P([[-40, 8], [-27, 16], [-14, 8]], false), WH, 3); glow(P([[14, 8], [27, 16], [40, 8]], false), WH, 3); glow(P([[-12, 52], [0, 44], [12, 52]], false), WH, 3); glow(P([[-30, 26], [-30, 50]], false), BL, 3); }
  else { glow(P([[-40, 6], [-27, -8], [-14, 6]], false), WH, 3); glow(P([[14, 6], [27, -8], [40, 6]], false), WH, 3); glow(P([[-26, 34], [0, 64], [26, 34]]), WH, 3); }
  ctx.restore(); ctx.restore(); }
const POSES = {
  shock: { kneeL: [-34, 150], footL: [-38, 296], kneeR: [34, 150], footR: [38, 296], elbowL: [-112, -150], handL: [-68, -300], elbowR: [112, -150], handR: [68, -300] },
  sit: { tilt: .12, kneeL: [-46, -150], footL: [-56, 40], kneeR: [46, -150], footR: [56, 40], elbowL: [-104, -120], handL: [-30, -150], elbowR: [104, -120], handR: [30, -150] },
  joy: { kneeL: [-74, 120], footL: [-40, 250], kneeR: [64, 96], footR: [140, 190], elbowL: [-130, -300], handL: [-150, -420], elbowR: [130, -300], handR: [150, -420] } };
function life(x, y, on) { const pts = [[0, 14], [-22, -6], [-12, -18], [0, -8], [12, -18], [22, -6]]; if (on) glow(P(pts.map(([a, b]) => [x + a, y + b])), PK, 3); else glow(P(pts.map(([a, b]) => [x + a, y + b])), 'rgba(255,111,168,.25)', 2); }
function hud(lives) { vtext('1UP', 90, 280, 40, PK); vtext('DAY 23/66', 90, 330, 44, WH); vtext('LIVES', 640, 280, 34, PK); life(700, 320, lives > 1); life(760, 320, lives > 0); }
function crt() { for (let y = 0; y < H; y += 4) { ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(0, y, W, 2); }
  const v = ctx.createRadialGradient(540, 900, 600, 540, 960, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 90; ctx.beginPath(); ctx.roundRect(-30, -30, W + 60, H + 60, 140); ctx.stroke(); }

function draw() {
  ctx.fillStyle = '#05070C'; ctx.fillRect(0, 0, W, H);
  glow(P([[60, 1320], [1020, 1320]], false), CY, 3); for (let i = 0; i < 9; i++) glow(P([[540 + (i - 4) * 40, 1320], [540 + (i - 4) * 140, 1460]], false), 'rgba(127,245,230,.35)', 2);
  if (F === 1) { hud(2); vtext('POV: you skipped', 90, 460, 60, CY); vtext('ONE day.', 90, 560, 96, OR); vtext('(23 days in)', 90, 630, 40, WH);
    person(540, 1000, .85, POSES.shock, 'shock'); vtext('?', 700, 690, 90, PK); }
  if (F === 2) { hud(1); for (let i = 0; i < 40; i++) { const x = 90 + ((i * 97) % 900), y = 420 + ((i * 53) % 700); glow(P([[x, y], [x - 6, y + 40]], false), 'rgba(127,168,255,.6)', 2); }
    vtext('it’s over.', 90, 480, 100, WH); vtext('back to day 1...', 90, 550, 44, BL); vtext('- 1 LIFE', 640, 400, 40, PK); person(540, 1250, .95, POSES.sit, 'sad'); }
  if (F === 3) { hud(1); glow(P([[90, 400], [990, 400], [990, 600], [90, 600]]), CY, 3); vtext('KATSU', 120, 460, 40, CY); vtext('Yesterday was a rest day.', 120, 515, 40, WH); vtext('You have 1 left in the last 7 days.', 120, 570, 34, WH);
    vtext('still 23.', 90, 720, 100, OR); vtext('CONTINUE?', 990, 800, 44, PK, 'right'); person(500, 1060, .8, POSES.joy, 'joy');
    [[200, 860], [860, 900], [300, 1000], [800, 1080]].forEach(([x, y]) => glow(P([[x - 22, y], [x + 22, y], [x, y], [x, y - 22], [x, y + 22]], false), OR, 3)); }
  crt(); }
draw(); document.title = 'done';
</script></body></html>
