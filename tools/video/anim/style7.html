<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/* 絵柄の試し その6: 液晶の携帯ゲーム機。?f=1 びっくり / 2 泣く / 3 喜ぶ
 * 人物は液晶の黒いシルエット。使っていない絵(ほかの2つの姿勢)が薄く透ける。数字は7セグメント。ハート=休みの残り */
const W = 1080, H = 1920, F = +(new URLSearchParams(location.search).get('f') || 1);
const ctx = document.getElementById('c').getContext('2d');
const LCD = '#2A3026', GHOST = 'rgba(42,48,38,.07)', SCREEN = '#B9C3A6', BODY = '#E4DCCB', BODY2 = '#CFC5B0', ACC = '#C8553D';
const SX = 90, SY = 250, SW = 900, SH = 1130;   // 液晶の場所
function limbPts(a, b, wa, wb) { const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), nx = -Math.sin(ang), ny = Math.cos(ang), p = [];
  for (let i = 0; i <= 6; i++) { const t = i / 6; p.push([a[0] + (b[0] - a[0]) * t + nx * (wa + (wb - wa) * t) / 2, a[1] + (b[1] - a[1]) * t + ny * (wa + (wb - wa) * t) / 2]); }
  for (let i = 0; i <= 6; i++) { const aa = ang + Math.PI / 2 - i / 6 * Math.PI; p.push([b[0] + Math.cos(aa) * wb / 2, b[1] + Math.sin(aa) * wb / 2]); }
  for (let i = 6; i >= 0; i--) { const t = i / 6; p.push([a[0] + (b[0] - a[0]) * t - nx * (wa + (wb - wa) * t) / 2, a[1] + (b[1] - a[1]) * t - ny * (wa + (wb - wa) * t) / 2]); }
  for (let i = 0; i <= 6; i++) { const aa = ang - Math.PI / 2 - i / 6 * Math.PI; p.push([a[0] + Math.cos(aa) * wa / 2, a[1] + Math.sin(aa) * wa / 2]); } return p; }
function poly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }
function ell(cx, cy, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill(); }
/* 液晶の人物(一色のシルエット。顔は抜き) */
function person(x, y, s, P, face, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  [[[-28, 0], P.kneeL, P.footL, -1], [[28, 0], P.kneeR, P.footR, 1]].forEach(([h, k, f, d]) => { poly(limbPts(h, k, 52, 42), col); poly(limbPts(k, f, 42, 34), col); ell(f[0] + 14 * d, f[1] + 8, 38, 18, col); });
  poly([[-70, -224], [0, -238], [70, -224], [88, -140], [74, 8], [-74, 8], [-88, -140]], col);
  const arms = () => [[[-62, -200], P.elbowL, P.handL], [[62, -200], P.elbowR, P.handR]].forEach(([sh, el, hd]) => { poly(limbPts(sh, el, 40, 34), col); poly(limbPts(el, hd, 34, 28), col); ell(hd[0], hd[1], 20, 22, col); });
  ctx.save(); ctx.translate(0, -330); ctx.rotate(P.tilt || 0); ell(0, 0, 76, 82, col);
  if (face) { ctx.fillStyle = SCREEN;
    if (face === 'shock') { [[-27, 4, 14, 18], [27, 4, 14, 18], [0, 48, 12, 16]].forEach(([ex, ey, rx, ry]) => { ctx.beginPath(); ctx.ellipse(ex, ey, rx, ry, 0, 0, 7); ctx.fill(); }); }
    else if (face === 'sad') { ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.strokeStyle = SCREEN; ctx.beginPath(); ctx.moveTo(-40, 8); ctx.quadraticCurveTo(-27, 18, -14, 8); ctx.moveTo(14, 8); ctx.quadraticCurveTo(27, 18, 40, 8); ctx.moveTo(-12, 52); ctx.quadraticCurveTo(0, 42, 12, 52); ctx.stroke(); }
    else { ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.strokeStyle = SCREEN; ctx.beginPath(); ctx.moveTo(-40, 6); ctx.quadraticCurveTo(-27, -10, -14, 6); ctx.moveTo(14, 6); ctx.quadraticCurveTo(27, -10, 40, 6); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-26, 34); ctx.quadraticCurveTo(0, 74, 26, 34); ctx.closePath(); ctx.fill(); }
  }
  ctx.restore(); arms(); ctx.restore(); }
const POSES = {
  shock: { kneeL: [-34, 150], footL: [-38, 296], kneeR: [34, 150], footR: [38, 296], elbowL: [-112, -150], handL: [-68, -300], elbowR: [112, -150], handR: [68, -300] },
  sit: { tilt: .12, kneeL: [-46, -150], footL: [-56, 40], kneeR: [46, -150], footR: [56, 40], elbowL: [-104, -120], handL: [-30, -150], elbowR: [104, -120], handR: [30, -150] },
  joy: { kneeL: [-74, 120], footL: [-40, 250], kneeR: [64, 96], footR: [140, 190], elbowL: [-130, -300], handL: [-150, -420], elbowR: [130, -300], handR: [150, -420] } };
/* 7セグメントの数字 */
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abdeg', 3: 'abcdg', 4: 'bcfg', 5: 'acdfg', 6: 'acdefg', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function seg7(str, x, y, hh, col) { const ww = hh * .5, t = hh * .11; [...str].forEach((ch, i) => { const ox = x + i * (ww + t * 2.6), on = SEG[ch] || '';
  const segs = { a: [ox + t, y, ww - 2 * t, t], d: [ox + t, y + hh - t, ww - 2 * t, t], g: [ox + t, y + hh / 2 - t / 2, ww - 2 * t, t], f: [ox, y + t, t, hh / 2 - 1.5 * t], b: [ox + ww - t, y + t, t, hh / 2 - 1.5 * t], e: [ox, y + hh / 2 + t / 2, t, hh / 2 - 1.5 * t], c: [ox + ww - t, y + hh / 2 + t / 2, t, hh / 2 - 1.5 * t] };
  for (const k in segs) { ctx.fillStyle = on.includes(k) ? col : GHOST; ctx.fillRect(...segs[k]); } }); }
function heart(x, y, s, col) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 8); ctx.bezierCurveTo(-26, -10, -14, -30, 0, -16); ctx.bezierCurveTo(14, -30, 26, -10, 0, 8); ctx.fill(); ctx.restore(); }
function label(str, x, y, size, col = LCD, align = 'left') { ctx.font = `700 ${size}px "Avenir Next Condensed", "Arial Narrow", sans-serif`; ctx.fillStyle = col; ctx.textAlign = align; ctx.fillText(str, x, y); }
function ghosts(current) { [['shock', 'shock', 540, 1080, .9], ['sit', 'sad', 540, 1200, .95], ['joy', 'joy', 520, 1060, .82]].forEach(([p, f, x, y, s]) => { if (p !== current) person(x, y, s, POSES[p], null, GHOST); }); }

function draw() {
  // 本体
  ctx.fillStyle = BODY; ctx.fillRect(0, 0, W, H); const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(0,0,0,.05)'); g.addColorStop(.5, 'rgba(255,255,255,.08)'); g.addColorStop(1, 'rgba(0,0,0,.06)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#4B4F48'; ctx.beginPath(); ctx.roundRect(SX - 40, SY - 40, SW + 80, SH + 80, 30); ctx.fill();
  ctx.fillStyle = SCREEN; ctx.beginPath(); ctx.roundRect(SX, SY, SW, SH, 10); ctx.fill();
  // 液晶の細かい格子
  ctx.fillStyle = 'rgba(0,0,0,.025)'; for (let y = SY; y < SY + SH; y += 4) ctx.fillRect(SX, y, SW, 1);
  ctx.save(); ctx.beginPath(); ctx.rect(SX, SY, SW, SH); ctx.clip();
  // 上の表示(状態)
  label('DAY', SX + 30, SY + 70, 40); seg7('23', SX + 120, SY + 24, 70, LCD); label('/66', SX + 260, SY + 90, 40);
  label('REST', SX + 560, SY + 70, 34); heart(SX + 720, SY + 60, 1.3, F === 1 ? GHOST : LCD); heart(SX + 790, SY + 60, 1.3, LCD);
  ghosts(F === 1 ? 'shock' : F === 2 ? 'sit' : 'joy');
  // 地面の線(区切りの線分)
  for (let x = SX + 20; x < SX + SW - 20; x += 46) { ctx.fillStyle = LCD; ctx.fillRect(x, SY + 1000, 34, 8); }
  if (F === 1) { label('POV: you skipped', SX + 30, SY + 200, 64); label('ONE day.', SX + 30, SY + 280, 84); label('(23 days in)', SX + 30, SY + 340, 40);
    person(540, 1080, .9, POSES.shock, 'shock', LCD); label('?', 700, 640, 90); }
  if (F === 2) { for (let i = 0; i < 6; i++) for (let j = 0; j < 8; j++) { ctx.fillStyle = (i + j) % 3 ? GHOST : LCD; ctx.fillRect(SX + 300 + i * 50, SY + 420 + j * 60 + (i % 2) * 30, 6, 30); }
    ctx.fillStyle = LCD; [[440, 700, 80, 56], [640, 700, 80, 56], [540, 660, 100, 80]].forEach(([a, b, c, d]) => { ctx.beginPath(); ctx.ellipse(a, b, c, d, 0, 0, 7); ctx.fill(); });
    label('it’s over.', SX + 30, SY + 220, 84); label('back to day 1…', SX + 30, SY + 290, 44); person(540, 1200, .95, POSES.sit, 'sad', LCD); }
  if (F === 3) { ctx.fillStyle = LCD; ctx.fillRect(SX + 30, SY + 140, SW - 60, 210); ctx.fillStyle = SCREEN; ctx.fillRect(SX + 38, SY + 148, SW - 76, 194);
    label('KATSU', SX + 60, SY + 205, 44); label('Yesterday was a rest day.', SX + 60, SY + 260, 44); label('You have 1 left in the last 7 days.', SX + 60, SY + 312, 40);
    label('still 23.', SX + 30, SY + 450, 96); person(520, 1060, .82, POSES.joy, 'joy', LCD);
    [[220, 760], [820, 800], [300, 900], [760, 640]].forEach(([x, y]) => { ctx.fillStyle = LCD; ctx.save(); ctx.translate(x, y); for (let k = 0; k < 4; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-4, -26, 8, 52); } ctx.restore(); }); }
  ctx.restore();
  // 液晶の映り込み
  const r = ctx.createLinearGradient(SX, SY, SX + SW, SY + SH); r.addColorStop(0, 'rgba(255,255,255,.10)'); r.addColorStop(.35, 'rgba(255,255,255,0)'); ctx.fillStyle = r; ctx.fillRect(SX, SY, SW, SH);
  // ボタンと名前(下の段。TikTok の表示に隠れても困らない飾り)
  label('KATSU', 400, SY + SH + 100, 48, '#8E8676'); label('HABIT · GAME', 570, SY + SH + 100, 30, '#A39B8A');
  ctx.fillStyle = ACC; [[760, 1560], [880, 1500]].forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 46, 0, 7); ctx.fill(); });
  ctx.fillStyle = '#4B4F48'; ctx.fillRect(170, 1490, 160, 46); ctx.fillRect(227, 1433, 46, 160);
}
draw(); document.title = 'done';
</script></body></html>
